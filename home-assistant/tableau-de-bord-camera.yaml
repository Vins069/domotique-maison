              entity: binary_sensor.openqiara_camera_reglages_d_image_par_defaut
        - type: markdown
          content: >-
            Ces réglages pilotent directement la caméra. **Rotation** : 0 pour une caméra posée sur son socle,
            2 pour une caméra fixée à l'envers ; les boutons « Restaurer » ne la changent jamais.
            Codec, débit et image clé se changent par SSH (`sh /media/oqc/reglage.sh`).
