# OpenQIARA Claude V15 : vue « Caméra Qiara » pour un tableau de bord Home Assistant.
# A coller dans un tableau de bord : Modifier > (trois points) > Modifier en YAML brut, puis ajouter ce bloc dans la
# liste « views: » (ou creer un tableau neuf et remplacer son contenu par « views: » suivi de ce bloc).
# Identifiants par defaut de l'appareil « OpenQiara Caméra » : a adapter si l'appareil a ete renomme.
# Image en direct : ajouter une carte de votre camera (Frigate, go2rtc ou l'integration « Camera generique ») qui lit
#   rtsp://<adresse de la camera>:8554/openqiara
# En H.265, la lecture dans le navigateur passe par WebRTC (Frigate 0.16.3 et plus, Home Assistant 2026.5.3 et plus,
# Chrome 136 et plus, applications Home Assistant) ; prevoir une sortie transcodee en H.264 pour les autres clients.
- title: Caméra Qiara
  path: camera-qiara
  icon: mdi:cctv
  type: sections
  max_columns: 3
  sections:
    - type: grid
      cards:
        - type: heading
          heading: État
          badges:
            - type: entity
              entity: binary_sensor.openqiara_camera_en_ligne
            - type: entity
              entity: sensor.openqiara_camera_codec_video
            - type: entity
              entity: sensor.openqiara_camera_debit_video
        - type: tile
          entity: switch.openqiara_camera_openqiara_shutter
          name: Cache de l'objectif
        - type: tile
          entity: sensor.openqiara_camera_version_openqiara
          name: Version
        - type: tile
          entity: binary_sensor.openqiara_camera_surveillant_actif
          name: QIARA Plus
        - type: tile
